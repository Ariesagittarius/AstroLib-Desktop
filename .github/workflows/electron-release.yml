name: AstroLib Desktop Release (Electron)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布版本 Tag (例如 v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: 🖥️ Build & Package Windows Desktop (NSIS & Portable)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Strict Type Checking
        run: npm run check:types

      - name: Build AstroLib Desktop App Shell (dist/)
        run: npm run build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Compile Electron Main Process & Preload Scripts
        run: node scripts/build-electron.mjs

      - name: Build Supported Exercise Artifacts (artifacts/exercises/)
        run: npm run build:exercises

      - name: Compile Official ABP Packages (artifacts/abp-packs/)
        run: node scripts/pack-book-abp.mjs --all --no-vectors --release-repo="${{ github.repository }}" --release-tag="${{ inputs.tag || github.ref_name }}"

      - name: Execute Automated Test Suites (Unit, Contract, Acceptance)
        run: npm test

      - name: Package Windows Installers with electron-builder (Mode A Shell Only)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload Shell + ABP Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: AstroLib Desktop ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
            artifacts/abp-packs/catalog.json
            artifacts/abp-packs/*.abp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
