name: Build and Release EPUBs

on:
  push:
    paths:
      - 'content-sources/collections/**'
      - 'src/config/**'
      - 'scripts/epub/**'
      - 'scripts/generate-epub.mjs'
      - '.github/workflows/epub-release.yml'
    branches:
      - main
      - electron/main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-epubs:
    name: Build EPUB Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate EPUBs
        run: npm run epub

      - name: Upload EPUB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astrolib-epubs
          path: public/epub/*.epub
          if-no-files-found: error

      - name: Release EPUBs to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "AstroLib Digital Textbooks EPUB Release (latest)"
          body: |

            Compiled EPUB3 distributions for the mathematics, science, and engineering collections.

            *Generated automatically via GitHub Actions.*
          files: public/epub/*.epub
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release EPUBs for Version Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: "AstroLib Release ${{ github.ref_name }}"
          files: public/epub/*.epub
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
